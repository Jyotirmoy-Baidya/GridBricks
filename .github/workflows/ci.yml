name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      TEST_DATABASE_URL: postgresql://windmon:windmon@localhost:5432/windmon
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: windmon
          POSTGRES_PASSWORD: windmon
          POSTGRES_DB: windmon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U windmon" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
