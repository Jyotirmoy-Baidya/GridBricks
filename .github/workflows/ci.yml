name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      TEST_DATABASE_URL: postgresql://windmon:windmon@localhost:5432/windmon
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: windmon
          POSTGRES_PASSWORD: windmon
          POSTGRES_DB: windmon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U windmon" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app scripts
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  # Builds both Docker images and starts the whole stack, as a reviewer would with ./startup.sh.
  stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: ./startup.sh
      - name: Smoke test
        run: |
          set -e
          curl -fsS localhost:5173/api/v1/health | grep -q '"status":"ok"'
          curl -fsS "localhost:5173/api/v1/meta/coverage" | grep -q '"loaded":true'
          curl -fsS "localhost:5173/api/v1/metrics/summary?start=2026-01-01T00:00:00Z&end=2026-02-01T00:00:00Z&horizon_h=4" | grep -q '"coverage":1.0'
          curl -fsS -o /dev/null localhost:5173/dashboard/accuracy/reliability
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80
