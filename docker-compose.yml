services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: windmon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-windmon}
      POSTGRES_DB: windmon
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # host 5433: a local Postgres service may already own 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windmon -d windmon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Cache only: raw API responses, computed results, the ingest lock and rate limits.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://windmon:${POSTGRES_PASSWORD:-windmon}@postgres:5432/windmon
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

  redisinsight:
    image: redis/redisinsight:latest
    profiles: ["tools"]
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  pg-data:
