services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

  redisinsight:
    image: redis/redisinsight:latest
    profiles: ["tools"]
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  redis-data:
